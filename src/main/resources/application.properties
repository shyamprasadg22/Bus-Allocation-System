# College Bus Seat Allocation System - Spring Boot Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# MySQL Database DataSource configuration using Environment Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_allocation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=BusAllocationHikariPool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# JSON / Jackson Settings
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd

# Logging
logging.level.root=INFO
logging.level.com.college.busallocation=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
